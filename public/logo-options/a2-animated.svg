<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .concept-a-glow { opacity: 0; animation: concept-a-in 1.05s ease forwards, concept-a-pulse 2.6s ease-in-out 1.05s infinite; }
      .concept-a-beam { clip-path: inset(0 100% 0 0); animation: concept-a-draw 1.25s cubic-bezier(.33,0,.2,1) .2s forwards, concept-a-pulse 2.6s ease-in-out 1.45s infinite; }
    }
    @keyframes concept-a-in { to { opacity: 1; } }
    @keyframes concept-a-draw { to { clip-path: inset(0 0 0 0); } }
    @keyframes concept-a-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.62; } }
  </style>
  <defs>
    <linearGradient id="tower" x1="50%" y1="6%" x2="46%" y2="94%">
