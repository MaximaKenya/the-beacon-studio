      <stop offset="42%" stop-color="#8a9cf0"/>
      <stop offset="100%" stop-color="#3ed6c6"/>
    </linearGradient>
    <linearGradient id="ray" x1="0%" y1="40%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#d4c4ff"/>
      <stop offset="100%" stop-color="#3ed6c6"/>
    </linearGradient>
    <filter id="lantern-blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <g class="concept-a-glow">
