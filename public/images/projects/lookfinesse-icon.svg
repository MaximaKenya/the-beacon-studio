<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="LookFinesse">
  <defs>
    <linearGradient id="lf-ic-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8EE"/>
      <stop offset="40%" stop-color="#E8C992"/>
      <stop offset="100%" stop-color="#8B6B3E"/>
    </linearGradient>
    <linearGradient id="lf-ic-depth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5E6C8"/>
      <stop offset="100%" stop-color="#7A5438"/>
    </linearGradient>
    <linearGradient id="lf-ic-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1218"/>
      <stop offset="100%" stop-color="#0A0608"/>
    </linearGradient>
    <filter id="lf-ic-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="lf-ic-sparkle" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#lf-ic-shadow)">
    <rect width="48" height="48" rx="12" fill="url(#lf-ic-bg)"/>
    <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" stroke="url(#lf-ic-gold)" stroke-width="0.85" opacity="0.8"/>
    <rect x="2.5" y="2.5" width="43" height="20" rx="9" fill="#FFFFFF" opacity="0.05"/>
    <path d="M10 34 C12 18 17 13 24 13 C31 13 36 18 38 34" stroke="url(#lf-ic-depth)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M12 29 Q24 8 36 29" stroke="#E8D0B0" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.35"/>
    <circle cx="33" cy="13" r="2.2" fill="url(#lf-ic-gold)" filter="url(#lf-ic-sparkle)"/>
    <circle cx="33" cy="13" r="4.8" fill="url(#lf-ic-gold)" opacity="0.14"/>
  </g>
</svg>
