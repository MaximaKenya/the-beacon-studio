<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 48" fill="none" role="img" aria-label="LookFinesse">
  <defs>
    <linearGradient id="lf-gold-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF8EE"/>
      <stop offset="35%" stop-color="#E8C992"/>
      <stop offset="70%" stop-color="#C9A05A"/>
      <stop offset="100%" stop-color="#8B6B3E"/>
    </linearGradient>
    <linearGradient id="lf-gold-depth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5E6C8"/>
      <stop offset="45%" stop-color="#D4AF7A"/>
      <stop offset="100%" stop-color="#7A5438"/>
    </linearGradient>
    <linearGradient id="lf-rose-word" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F0"/>
      <stop offset="40%" stop-color="#F0DED4"/>
      <stop offset="100%" stop-color="#C4A088"/>
    </linearGradient>
    <linearGradient id="lf-curve-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8C4"/>
      <stop offset="100%" stop-color="#A67C52"/>
    </linearGradient>
    <linearGradient id="lf-icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1218"/>
      <stop offset="100%" stop-color="#0A0608"/>
    </linearGradient>
    <filter id="lf-soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="lf-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 3D icon mark -->
  <g filter="url(#lf-soft-shadow)">
    <rect x="1" y="4" width="40" height="40" rx="11" fill="url(#lf-icon-bg)"/>
    <rect x="1.5" y="4.5" width="39" height="39" rx="10.5" stroke="url(#lf-gold-top)" stroke-width="0.8" opacity="0.85"/>
    <rect x="3" y="6" width="36" height="18" rx="8" fill="#FFFFFF" opacity="0.04"/>
    <path d="M11 33 C13 17 18 13 24 13 C30 13 35 17 37 33" stroke="url(#lf-gold-depth)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M13 28 Q24 9 35 28" stroke="#E8D0B0" stroke-width="0.85" stroke-linecap="round" fill="none" opacity="0.35"/>
    <circle cx="29" cy="14" r="2.2" fill="url(#lf-gold-top)" filter="url(#lf-glow)"/>
    <circle cx="29" cy="14" r="4.5" fill="url(#lf-gold-top)" opacity="0.15"/>
  </g>
  <!-- Custom path wordmark: LookFinesse -->
  <g transform="translate(50, 8)">
    <!-- Look -->
    <path d="M0 28 L0 8 L3.5 8 L3.5 24.5 L12 24.5 L12 28 Z" fill="url(#lf-rose-word)"/>
    <path d="M15 28 L15 8 L26 8 Q31 8 31 13 Q31 17.5 26.5 18.5 L31.5 28 L27.5 28 L23 19 L19 19 L19 28 Z M19 15.5 L25.5 15.5 Q27.5 15.5 27.5 13.5 Q27.5 11.5 25.5 11.5 L19 11.5 Z" fill="url(#lf-rose-word)"/>
    <path d="M34 28 L34 8 L37.5 8 L37.5 24.5 L46 24.5 L46 28 Z" fill="url(#lf-rose-word)"/>
    <path d="M49 28 L49 8 L59 8 Q64 8 64 13.5 Q64 19 59 19 L52.5 19 L52.5 28 L49 28 Z M52.5 11.5 L58.5 11.5 Q60.5 11.5 60.5 13.5 Q60.5 15.5 58.5 15.5 L52.5 15.5 Z" fill="url(#lf-rose-word)"/>
    <!-- Finesse (gold accent) -->
    <path d="M72 28 L72 8 L75.5 8 L75.5 24.5 L84 24.5 L84 28 Z" fill="url(#lf-gold-top)"/>
    <path d="M87 28 L87 8 L90.5 8 L90.5 15.5 L98 8 L102 8 L94 16.5 L102.5 28 L98.5 28 L91.5 18.5 L90.5 19.5 L90.5 28 Z" fill="url(#lf-gold-top)"/>
    <path d="M105 28 L105 8 L115 8 Q120 8 120 13.5 Q120 19 115 19 L108.5 19 L108.5 28 L105 28 Z M108.5 11.5 L114.5 11.5 Q116.5 11.5 116.5 13.5 Q116.5 15.5 114.5 15.5 L108.5 15.5 Z" fill="url(#lf-gold-top)"/>
    <path d="M123 28 L123 8 L133 8 Q138 8 138 13.5 Q138 19 133 19 L126.5 19 L126.5 28 L123 28 Z M126.5 11.5 L132.5 11.5 Q134.5 11.5 134.5 13.5 Q134.5 15.5 132.5 15.5 L126.5 15.5 Z" fill="url(#lf-gold-top)"/>
    <path d="M141 28 L141 8 L151 8 Q156 8 156 13.5 Q156 19 151 19 L144.5 19 L144.5 28 L141 28 Z M144.5 11.5 L150.5 11.5 Q152.5 11.5 152.5 13.5 Q152.5 15.5 150.5 15.5 L144.5 15.5 Z" fill="url(#lf-gold-top)"/>
    <path d="M159 28 L159 8 L169 8 Q174 8 174 13.5 Q174 19 169 19 L162.5 19 L162.5 28 L159 28 Z M162.5 11.5 L168.5 11.5 Q170.5 11.5 170.5 13.5 Q170.5 15.5 168.5 15.5 L162.5 15.5 Z" fill="url(#lf-gold-top)"/>
    <path d="M177 28 L177 8 L187 8 Q192 8 192 13.5 Q192 19 187 19 L180.5 19 L180.5 28 L177 28 Z M180.5 11.5 L186.5 11.5 Q188.5 11.5 188.5 13.5 Q188.5 15.5 186.5 15.5 L180.5 15.5 Z" fill="url(#lf-gold-top)"/>
    <!-- Underline fineness curve -->
    <path d="M2 32 Q95 40 192 32" stroke="url(#lf-curve-shine)" stroke-width="0.75" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
</svg>
