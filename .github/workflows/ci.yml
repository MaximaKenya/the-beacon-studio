name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail on critical vulnerabilities
        run: npm audit --audit-level=critical --omit=dev
      - run: npx tsc --noEmit
      - run: npm test
